<div class="logincontainer">
    <form method="post">
        {% csrf_token %}

        <div class="boxes">
            <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Verify OTP</h2>

            <div class="box">
                <label for="otp">Enter OTP</label>
                <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" required maxlength="6">
            </div>

            <div class="box">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
            </div>

            <div class="box">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
            </div>

            <div class="box">
                <input type="submit" value="Reset Password">
            </div>

            <div class="box">
                <a href="{% url 'login' %}" class="register-btn">Back to Login</a>
            </div>
        </div>
    </form>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>
            {{ message }}
        </li>
        {% endfor %}
    </ul>
    {% endif %}
</div>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url('/static/images/auction.jpg');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    padding: 20px;
}

.logincontainer {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    margin: 0 auto;
}

.login-title {
    text-align: center;
    margin-bottom: 25px;
    font-size: 26px;
    font-weight: 700;
    color: #111827;
}

.boxes {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.box {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.box label {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

/* This styles ALL inputs on the page to match login/register */
input[type="text"],
input[type="email"],
input[type="password"] {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
    background: #f9f9f9;
    transition: 0.2s ease;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="password"]:focus {
    outline: none;
    border-color: #d62828;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(214, 40, 40, 0.15);
}

/* Style submit button to match login button */
input[type="submit"] {
    margin-top: 10px;
    height: 48px;
    border-radius: 8px;
    border: none;
    background: #d62828;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

input[type="submit"]:hover {
    background: #b61f1f;
    transform: translateY(-1px);
}

/* Back to Login link style */
.register-btn {
    text-align: center;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    color: #333;
    font-size: 14px;
    transition: 0.2s ease;
}

.register-btn:hover {
    background: rgba(214, 40, 40, 0.1);
    color: #d62828;
}


.messages {
    list-style: none;
    margin-top: 16px;
    padding: 0;
}

.messages li {
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 8px;
}

</style>
