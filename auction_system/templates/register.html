


    <div class="register-container">
            <form method="post">
                {% csrf_token %}
            <div class="boxes">
                <div class="box">
                    {{ form.username.label }}
                    {{ form.username }}
                </div>

                <div class="box">
                    {{ form.email.label }}
                    {{ form.email }}
                </div>


                <div class="box">
                    {{ form.password1.label }}
                    {{ form.password1 }}
                </div>

                <div class="box">
                    {{ form.password2.label }}
                    {{ form.password2 }}
                </div>
                <div class="box">
                <input type="submit" value="Register">
                </div>
                
            </div>
                  {% if form.errors %}
                    <div style="color: rgb(23, 19, 209); font-size: 18px; margin-bottom: 20px;">
                        {{ form.errors }}
                    </div>
                    {% endif %}
            </form>
    </div>
