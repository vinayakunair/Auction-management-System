


    <div class="register-container">
            <form method="post">
                {% csrf_token %}
            <div class="boxes">
             <div class="box">
                {{ form.username.label }}
                {{ form.username }}
                <div style="color:red; font-size:14px;">
                    {{ form.username.errors }}
                </div>
            </div>

            <div class="box">
                {{ form.email.label }}
                {{ form.email }}
                <div style="color:red; font-size:14px;">
                    {{ form.email.errors }}
                </div>
            </div>


               <div class="box">
                    {{ form.password1 }}
                    <small style="color:red; font-size:14px;">
                        {{ form.password1.help_text }}
                    </small>
                    <div style="color:red; font-size:14px;">
                        {{ form.password1.errors }}
                    </div>
                </div>

                <div class="box">
                    {{ form.password2 }}
                    <div style="color:red; font-size:14px;">
                        {{ form.password2.errors }}
                    </div>
                </div>


                <div class="box">
                <input type="submit" value="Register">
                </div>
               <div class="box">
                <a href="{% url 'seller_register' %}" class="seller-btn">
                    <input type="button" value="Register as Seller ?">
                </a>

               </div>

                
            </div>
                  
            </form>
    </div>

    }

 input:hover::placeholder{

 }
