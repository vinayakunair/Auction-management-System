<div class="logincontainer">
    <form method="post" novalidate>
        {% csrf_token %}

        <h2 class="login-title">Create Account</h2>

        <div class="boxes">

            <div class="box">
                <label for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
                <div class="error">{{ form.username.errors }}</div>
            </div>

            <div class="box">
                <label for="{{ form.email.id_for_label }}">Email</label>
                {{ form.email }}
                <div class="error">{{ form.email.errors }}</div>
            </div>

            <div class="box">
                <label for="{{ form.password1.id_for_label }}">Password</label>
                {{ form.password1 }}
                <small class="help">{{ form.password1.help_text }}</small>
                <div class="error">{{ form.password1.errors }}</div>
            </div>

            <div class="box">
                <label for="{{ form.password2.id_for_label }}">Confirm Password</label>
                {{ form.password2 }}
                <div class="error">{{ form.password2.errors }}</div>
            </div>

            <button type="submit" class="login-btn">Register</button>

            <a href="{% url 'seller_register' %}" class="seller-link">
                Register as Seller?
            </a>

        </div>
    </form>
</div>


<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url('/static/images/auction.jpg');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    padding: 20px;
}

.logincontainer {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.login-title {
    text-align: center;
    margin-bottom: 25px;
    font-size: 26px;
    font-weight: 700;
}

.boxes {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.box {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.box label {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

.form-input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
    background: #f9f9f9;
    transition: 0.2s ease;
}

.form-input:focus {
    outline: none;
    border-color: #d62828;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(214, 40, 40, 0.15);
}

.login-btn {
    margin-top: 10px;
    height: 48px;
    border-radius: 8px;
    border: none;
    background: #d62828;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

.login-btn:hover {
    background: #b61f1f;
    transform: translateY(-1px);
}

.error {
    font-size: 13px;
    color: #b00020;
    margin-top: 4px;
}

.seller-link {
    display: inline-block;
    text-align: center;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    color: #333;
    font-size: 14px;
    transition: 0.2s ease;
}

.seller-link:hover {
    background: rgba(214, 40, 40, 0.1);
    color: #d62828;
}
</style>
