<div class="logincontainer">
    <form method="post" novalidate>
        {% csrf_token %}

        <h2 class="login-title">Reset Password</h2>

        <div class="boxes">

            <div class="box">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
            </div>

            <button type="submit" class="login-btn">Send OTP</button>

            <a href="{% url 'login' %}" class="seller-link">Back to Login</a>

        </div>
    </form>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="msg {{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url('/static/images/auction.jpg');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    padding: 20px;
}

.logincontainer {
    width: 100%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    margin: 0 auto;
}

.login-title {
    text-align: center;
    margin-bottom: 25px;
    font-size: 26px;
    font-weight: 700;
    color: #111827;
}

.boxes {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.box {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.box label {
    font-size: 14px;
    font-weight: 600;
    color: #333;
}

.form-input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
    background: #f9f9f9;
    transition: 0.2s ease;
}

.form-input:focus {
    outline: none;
    border-color: #d62828;
    background: #fff;
    box-shadow: 0 0 0 2px rgba(214, 40, 40, 0.15);
}

.login-btn {
    margin-top: 10px;
    height: 48px;
    border-radius: 8px;
    border: none;
    background: #d62828;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

.login-btn:hover {
    background: #b61f1f;
    transform: translateY(-1px);
}

.seller-link {
    text-align: center;
    margin-top: 8px;
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    color: #333;
    font-size: 14px;
    transition: 0.2s ease;
}

.seller-link:hover {
    background: rgba(214, 40, 40, 0.1);
    color: #d62828;
}

.messages {
    list-style: none;
    margin-top: 16px;
    padding: 0;
}

.msg {
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 8px;
}

.msg.error {
    background: #ffe5e5;
    color: #b00020;
}

.msg.success {
    background: #e6fff1;
    color: #0a7a46;
}

/* Mobile tweaks */
@media (max-width: 480px) {
    .logincontainer {
        padding: 24px 20px;
    }

    .login-title {
        font-size: 22px;
    }
}

</style>
