{% extends "base.html" %}

{% block content %}
<h2>Auction Form</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<style>

   

    h2 {
    margin-bottom: 20px;
    font-size: 24px;
    color: #222;
    padding-left: 20px;
}

form {
    max-width: 500px;
    padding-left: 20px;
}

form p {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #333;
}

input,
textarea,
select {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    padding: 8px 16px;
    font-size: 14px;
    background-color: #222;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #000;
}

</style>

{% endblock %}
